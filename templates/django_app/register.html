{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Movie rating</title>
    <link rel="icon" href="{% static 'images/3d-glasses.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/register1.css' %}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <form method="POST" action="{% url 'django_app:register' %}">
        {% csrf_token %}
        <h1>Register</h1>
        <div class="input-box">
            <input type="text" id="username" placeholder="Username" required name="username" maxlength="150" autocomplete="username" value="{{ form.username.value|default:'' }}">
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
            <input type="email" id="email" placeholder="Email" required name="email" autocomplete="email" value="{{ form.email.value|default:'' }}">
            <i class='bx bx-envelope'></i>
        </div>
        <div class="input-box">
            <input type="password" id="password" placeholder="Password (8+ characters)" required minlength="8" name="password" autocomplete="new-password">
            <i class='bx bxs-lock-alt'></i>
        </div>
        <button type="submit" class="btn">Register</button>
        <div class="register-link">
            <p>Already have an account?<a href="{% url 'django_app:login' %}">Login</a></p>
            <p><a href="{% url 'django_app:home' %}">← Continue as guest</a></p>
        </div>
        {% if error %}
        <div class="error-message" role="alert"><p>{{ error }}</p></div>
        {% endif %}
    </form>
</div>
</body>
</html>
