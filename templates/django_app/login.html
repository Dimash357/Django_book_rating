{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Movie rating</title>
    <link rel="icon" href="{% static 'images/3d-glasses.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <form method="POST" action="{% url 'django_app:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <h1>Login</h1>
        {% for message in messages %}<div class="info-message"><p>{{ message }}</p></div>{% endfor %}
        <div class="input-box">
            <input type="text" id="username" placeholder="Username or email" required name="username" autocomplete="username" autofocus value="{{ request.POST.username|default:'' }}">
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
            <input type="password" id="password" placeholder="Password" required name="password" autocomplete="current-password">
            <i class='bx bxs-lock-alt'></i>
        </div>
        <div class="remember-forget">
            <label><input type="checkbox" name="remember" value="1" checked> Remember me</label>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="register-link">
            <p>Don't have an account?<a href="{% url 'django_app:register' %}">Register</a></p>
            <p><a href="{% url 'django_app:home' %}">← Continue as guest</a></p>
        </div>
        {% if error1 %}
        <div class="error-message" role="alert"><p>{{ error1 }}</p></div>
        {% endif %}
    </form>
</div>
</body>
</html>
